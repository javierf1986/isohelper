[pytest]
# Pytest Configuration for ISOHelper Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Asyncio mode
asyncio_mode = auto

# Coverage options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html:coverage_html
    --cov-report=term-missing
    --cov-report=xml
    --cov-config=.coveragerc
    --ignore=migrations
    --ignore=alembic
    --ignore=__pycache__

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, tests interactions)
    api: API endpoint tests
    service: Service layer tests
    model: Database model tests
    slow: Slow tests (mark with @pytest.mark.slow)
    auth: Authentication tests
    workspace: Workspace-related tests
    artifact: Artifact management tests
    document: Document generation tests
    analytics: Analytics tests
    export: Export functionality tests
    ai: AI/LLM-powered tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
